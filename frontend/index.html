<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kindred — Semantic Match Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #12111F; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; color: #F2E9DC;
  }
  #card {
    width: min(1400px, 96vw); height: min(820px, 94vh);
    background: #1B1B2F;
    box-shadow: 0 0 0 4px #0D0C16, 0 30px 80px rgba(0,0,0,.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; border-bottom: 4px solid #3D3A5C; flex: none;
  }
  header .left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .badge {
    font: 400 8px 'Press Start 2P', monospace; color: #1B1B2F; background: #F2C14E;
    padding: 6px 8px; box-shadow: 3px 3px 0 #A66E3F; white-space: nowrap;
  }
  .titles h1 {
    font: 400 11px 'Press Start 2P', monospace; color: #F2E9DC; margin: 0;
    line-height: 1.6; letter-spacing: .5px;
  }
  .titles .sub {
    font: 400 11px 'JetBrains Mono', monospace; color: #8B8AA8; margin-top: 3px;
  }
  header .right { display: flex; align-items: center; gap: 18px; flex: none; }
  nav a {
    font: 400 8px 'Press Start 2P', monospace; color: #F2E9DC; background: #3D3A5C;
    border: none; padding: 8px 10px; box-shadow: 3px 3px 0 #12111F;
    text-decoration: none; white-space: nowrap; cursor: pointer;
  }
  nav a:hover { background: #47436e; }
  button.pixel {
    font: 400 8px 'Press Start 2P', monospace; color: #F2E9DC; background: #3D3A5C;
    border: none; padding: 8px 10px; box-shadow: 3px 3px 0 #12111F; cursor: pointer;
  }
  button.pixel:hover { background: #47436e; }
  button.pixel:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #12111F; }

  #app { flex: 1; display: flex; min-height: 0; }
  #graph-wrap { flex: 1; position: relative; background: #12111F; }
  svg { width: 100%; height: 100%; display: block; }

  #panel {
    width: 320px; flex: none; border-left: 4px solid #3D3A5C; background: #1B1B2F;
    padding: 22px; overflow-y: auto;
  }
  #panel h2 { font: 400 12px 'Press Start 2P', monospace; color: #F2E9DC; margin: 0 0 10px; }
  #panel .score-badge {
    display: inline-block; margin-bottom: 16px;
    font: 400 9px 'JetBrains Mono', monospace; color: #1B1B2F; background: #F2C14E;
    padding: 4px 9px; box-shadow: 2px 2px 0 #A66E3F;
  }
  #panel h3 {
    font: 400 9px 'Press Start 2P', monospace; color: #8B8AA8; letter-spacing: 1px;
    margin: 20px 0 10px;
  }
  #panel ul { padding-left: 18px; margin: 0; }
  #panel li { margin-bottom: 9px; font-size: 12.5px; line-height: 1.5; color: #D8D2E8; }
  #panel .empty { color: #8B8AA8; font-size: 12px; margin-top: 40px; text-align: center; font-family: 'JetBrains Mono', monospace; }

  .node circle { cursor: pointer; stroke: #12111F; stroke-width: 3px; }
  .node text { fill: #D8D2E8; font: 10px 'JetBrains Mono', monospace; pointer-events: none; }
  .node.center circle { fill: #F2C14E; stroke: #A66E3F; }
  .node.center text { fill: #F2C14E; font-weight: 600; }
  .node.selected circle { stroke: #F2C14E; stroke-width: 3px; }
  .link { stroke: #3D3A5C; stroke-opacity: .9; }

  #status {
    position: absolute; top: 12px; left: 14px;
    font: 400 9px 'JetBrains Mono', monospace; color: #8B8AA8;
    background: rgba(18,17,31,.75); padding: 5px 9px; box-shadow: 2px 2px 0 #0D0C16;
  }
  #recluster-btn { position: absolute; bottom: 16px; left: 14px; }
</style>
</head>
<body>
<div id="card">
  <header>
    <div class="left">
      <span class="badge">GRAPH</span>
      <div class="titles">
        <h1>KINDRED — SEMANTIC MATCH GRAPH</h1>
        <div class="sub">who you're semantically closest to, and why</div>
      </div>
    </div>
    <div class="right">
      <nav><a href="../viz/village.html">WATCH THE AGENTS →</a></nav>
    </div>
  </header>

  <div id="app">
    <div id="graph-wrap">
      <div id="status">loading…</div>
      <svg></svg>
      <button id="recluster-btn" class="pixel">SIMULATE RE-CLUSTER</button>
    </div>
    <div id="panel"><div class="empty">Click a node to see why it matched.</div></div>
  </div>
</div>

<script>
// ---- fallback sample payload, matches backend/README.md contract exactly ----
const SAMPLE_PAYLOAD = {
  center: "user",
  nodes: [
    { id: "user", name: "You", score: 1.0, x: 0, y: 0 },
    { id: "p1", name: "Aria Chen", score: 0.87, x: 120, y: -80 },
    { id: "p2", name: "Devon Marsh", score: 0.74, x: -140, y: -40 },
    { id: "p3", name: "Priya Nair", score: 0.63, x: 90, y: 130 },
    { id: "p4", name: "Sam Okafor", score: 0.55, x: -110, y: 110 },
    { id: "p5", name: "Lena Vogt", score: 0.41, x: 180, y: 30 },
    { id: "p6", name: "Marcus Webb", score: 0.33, x: -180, y: -10 }
  ],
  edges: [
    { source: "user", target: "p1", weight: 0.87 },
    { source: "user", target: "p2", weight: 0.74 },
    { source: "user", target: "p3", weight: 0.63 },
    { source: "user", target: "p4", weight: 0.55 },
    { source: "user", target: "p5", weight: 0.41 },
    { source: "user", target: "p6", weight: 0.33 }
  ],
  reasons: {
    p1: ["same trajectory: finance → agent infra", "both seeking cofounder", "overlapping reading list on eval design"],
    p2: ["shared thesis on vertical agents", "both ex-founders, similar exit stage"],
    p3: ["complementary skillset: design + your infra", "mutual interest in dev tooling"],
    p4: ["adjacent domain: robotics ops", "both relocating to same city"],
    p5: ["light overlap: early-stage investing", "shared alma mater"],
    p6: ["weak signal: same conference attended"]
  }
};

const svg = d3.select("svg");
const statusEl = document.getElementById("status");
const panel = document.getElementById("panel");
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.4, 3]).on("zoom", (ev) => g.attr("transform", ev.transform)));

let payload = null;
let selectedId = null;

function colorForScore(s) {
  // low score = muted stone/purple, high score = warm orange -> gold
  const t = Math.max(0, Math.min(1, s));
  const from = [0x3D, 0x3A, 0x5C]; // #3D3A5C
  const to   = [0xE8, 0x74, 0x3B]; // #E8743B
  const r = Math.round(from[0] + t * (to[0] - from[0]));
  const gr = Math.round(from[1] + t * (to[1] - from[1]));
  const b = Math.round(from[2] + t * (to[2] - from[2]));
  return `rgb(${r},${gr},${b})`;
}

function render(data, animate) {
  const w = svg.node().clientWidth, h = svg.node().clientHeight;
  const cx = w / 2, cy = h / 2;

  const nodeById = new Map(data.nodes.map(n => [n.id, n]));
  const linkSel = g.selectAll("line.link").data(data.edges, d => d.source + "-" + d.target);
  linkSel.exit().remove();
  const linkEnter = linkSel.enter().append("line").attr("class", "link");
  const links = linkEnter.merge(linkSel);

  const t = animate ? links.transition().duration(700) : links;
  t.attr("x1", d => (nodeById.get(d.source)?.x ?? 0) + cx)
   .attr("y1", d => (nodeById.get(d.source)?.y ?? 0) + cy)
   .attr("x2", d => (nodeById.get(d.target)?.x ?? 0) + cx)
   .attr("y2", d => (nodeById.get(d.target)?.y ?? 0) + cy)
   .attr("stroke-width", d => 1 + d.weight * 6);

  const nodeSel = g.selectAll("g.node").data(data.nodes, d => d.id);
  nodeSel.exit().remove();

  const nodeEnter = nodeSel.enter().append("g").attr("class", "node")
    .on("click", (ev, d) => selectNode(d));
  nodeEnter.append("circle");
  nodeEnter.append("text").attr("text-anchor", "middle");

  const nodes = nodeEnter.merge(nodeSel)
    .attr("class", d => "node" + (d.id === data.center ? " center" : "") + (d.id === selectedId ? " selected" : ""));

  const nt = animate ? nodes.transition().duration(700) : nodes;
  nt.attr("transform", d => `translate(${d.x + cx},${d.y + cy})`);

  nodes.select("circle")
    .attr("fill", d => d.id === data.center ? "#F2C14E" : colorForScore(d.score));
  const ct = animate ? nodes.select("circle").transition().duration(700) : nodes.select("circle");
  ct.attr("r", d => d.id === data.center ? 26 : 10 + d.score * 22);

  nodes.select("text")
    .attr("dy", d => (d.id === data.center ? 42 : 14 + d.score * 22 + 12))
    .text(d => d.name);
}

function selectNode(d) {
  selectedId = d.id;
  g.selectAll("g.node").classed("selected", n => n.id === selectedId);
  const reasons = (payload.reasons && payload.reasons[d.id]) || [];
  panel.innerHTML = `
    <h2>${d.name}</h2>
    <span class="score-badge">SCORE ${d.score.toFixed(2)}</span>
    <h3>WHY THIS MATCH</h3>
    ${reasons.length
      ? `<ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>`
      : `<div class="empty" style="margin-top:10px;">No reasoning provided for this node.</div>`}
  `;
}

async function loadPayload() {
  // try live backend POST /graph
  try {
    const r = await fetch("/graph", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    if (r.ok) {
      statusEl.textContent = "live: POST /graph";
      return await r.json();
    }
  } catch (e) { /* fall through */ }

  // try static sample file (written by the backend workstream)
  try {
    const r2 = await fetch("../backend/sample_graph.json");
    if (r2.ok) {
      statusEl.textContent = "sample: backend/sample_graph.json";
      return await r2.json();
    }
  } catch (e) { /* fall through */ }

  statusEl.textContent = "fallback: inline sample data";
  return SAMPLE_PAYLOAD;
}

// ---- re-cluster stub: window.applyWeights(w) ----
// Re-scores nodes using a length-6 weight vector against a fake per-node feature
// vector (deterministic hash of id), reshuffles x/y outward by new score, and
// re-renders with a transition so the "it's learning" moment is visible.
window.applyWeights = function(w) {
  if (!payload) return;
  if (!Array.isArray(w) || w.length !== 6) {
    console.warn("applyWeights expects a length-6 array, got", w);
  }
  const weights = Array.isArray(w) && w.length === 6 ? w : [1,1,1,1,1,1];

  function featureVec(id) {
    let seed = 0;
    for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) >>> 0;
    const feats = [];
    for (let i = 0; i < 6; i++) {
      seed = (seed * 1103515245 + 12345) >>> 0;
      feats.push((seed % 1000) / 1000);
    }
    return feats;
  }

  payload.nodes.forEach(n => {
    if (n.id === payload.center) return;
    const feats = featureVec(n.id);
    let dot = 0, norm = 0;
    for (let i = 0; i < 6; i++) { dot += feats[i] * weights[i]; norm += weights[i]; }
    n.score = Math.max(0.05, Math.min(0.99, dot / (norm || 1)));
  });

  payload.edges.forEach(e => {
    const target = payload.nodes.find(n => n.id === e.target);
    if (target) e.weight = target.score;
  });

  const others = payload.nodes.filter(n => n.id !== payload.center)
    .sort((a, b) => b.score - a.score);
  const n = others.length;
  others.forEach((node, i) => {
    const angle = (i / n) * Math.PI * 2;
    const radius = 260 - node.score * 200;
    node.x = Math.cos(angle) * radius;
    node.y = Math.sin(angle) * radius;
  });

  render(payload, true);
  statusEl.textContent = "re-clustered with w=[" + weights.map(x => x.toFixed(2)).join(",") + "]";
};

document.getElementById("recluster-btn").addEventListener("click", () => {
  const randomW = Array.from({ length: 6 }, () => Math.random());
  window.applyWeights(randomW);
});

(async function init() {
  payload = await loadPayload();
  render(payload, false);
})();

window.addEventListener("resize", () => { if (payload) render(payload, false); });
</script>
</body>
</html>
