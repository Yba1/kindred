<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindred · Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12111F; --card:#1B1B2F; --outline:#0D0C16; --divider:#3D3A5C;
  --ink:#F2E9DC; --muted:#8B8AA8; --gold:#F2C14E; --gold-shadow:#A66E3F;
  --orange:#E8743B; --green:#6B8F71; --purple:#8B5A7A; --parchment:#F2E9DC;
  --grass:#7BA05B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:'JetBrains Mono',monospace;color:var(--ink);-webkit-font-smoothing:none}
a{color:var(--gold)} a:hover{color:var(--orange)}
.stage-wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px}

.game{width:1160px;background:var(--card);box-shadow:0 0 0 4px var(--outline),0 30px 80px rgba(0,0,0,.5);
  flex:none;display:flex;flex-direction:column}

/* ---- header ---- */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:4px solid var(--divider)}
.top .left{display:flex;align-items:center;gap:16px;min-width:0}
.badge{font:400 8px 'Press Start 2P',monospace;color:var(--card);background:var(--gold);padding:6px 8px;
  box-shadow:3px 3px 0 var(--gold-shadow);white-space:nowrap}
.titles h1{font:400 11px 'Press Start 2P',monospace;color:var(--ink);margin:0;line-height:1.6;letter-spacing:.5px}
.titles .sub{font:400 11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:3px}
.top .right{display:flex;align-items:center;gap:18px;flex:none}
.timer{text-align:right}
.timer .t{font:400 17px 'Press Start 2P',monospace;color:var(--orange)}
.timer .l{font:400 9px 'JetBrains Mono',monospace;color:var(--muted);margin-top:3px}
.replay{font:400 8px 'Press Start 2P',monospace;color:var(--ink);background:var(--divider);border:none;
  padding:8px 10px;box-shadow:3px 3px 0 var(--outline);cursor:pointer}
.replay:hover{background:#47436e}
.replay:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--outline)}

/* ---- stage (fixed-size scene, scaled to fit) ---- */
.stage-outer{position:relative;height:620px;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1180px;height:620px;transform-origin:0 0;
  will-change:transform;contain:layout style paint;
  background:var(--grass);
  background-image:
    repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 4px,transparent 4px 26px),
    repeating-linear-gradient(90deg,transparent 0 30px,rgba(58,90,42,.22) 30px 34px)}
/* cheap vignette (radial-gradient) instead of a 140px-blur inset box-shadow,
   which forces a large-area re-blur on every repaint in this stacking context */
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(24,42,18,.45) 100%)}
.decor{position:absolute;inset:0;contain:layout style paint}
.abs{position:absolute}

/* villager sprite */
.villager{width:34px;height:46px;position:relative}
.villager .hat{position:absolute;left:9px;top:0;width:16px;height:10px}
.villager .brim{position:absolute;left:4px;top:10px;width:26px;height:5px}
.villager .head{position:absolute;left:8px;top:15px;width:18px;height:11px}
.villager .head::before{content:"";position:absolute;left:3px;top:4px;width:3px;height:3px;background:#1B1B2F;box-shadow:9px 0 0 #1B1B2F}
.villager .body{position:absolute;left:4px;top:26px;width:26px;height:14px}
.villager .legs{position:absolute;left:10px;top:40px;width:6px;height:5px}
.actor{position:absolute;width:68px;text-align:center;
  transition:left .65s cubic-bezier(.22,.9,.32,1),top .65s cubic-bezier(.22,.9,.32,1);
  z-index:5;will-change:left,top}
.actor .name{font:400 7px 'Press Start 2P',monospace;color:#fff;text-shadow:2px 2px 0 #1B1B2F;margin-bottom:3px}
.actor .villager-wrap{position:relative;width:34px;height:46px;margin:0 auto;outline-offset:3px}
.actor .villager-wrap.speaking{outline:4px solid var(--orange)}
.actor .shadow{width:30px;height:5px;background:rgba(27,27,47,.28);margin:2px auto 4px}
.actor .stance{font:400 9px 'JetBrains Mono',monospace;background:#1B1B2F;padding:2px 6px;display:inline-block}
.actor .friction{width:44px;height:5px;background:var(--purple);margin:4px auto 0}

/* house */
.house{position:absolute;width:110px;height:100px}
.house .plaque{position:absolute;left:30px;top:48px;width:50px;height:13px;background:#2F2D49;
  display:flex;align-items:center;justify-content:center;font:400 6px 'Press Start 2P',monospace;color:var(--ink);
  white-space:nowrap;overflow:hidden}

/* speech bubble (parchment) */
.bubble{position:absolute;width:300px;background:var(--parchment);border:4px solid #1B1B2F;
  box-shadow:8px 8px 0 rgba(27,27,47,.35),inset 0 -4px 0 #E0D4BC;padding:11px 13px;z-index:8;
  opacity:0;pointer-events:none;transition:opacity .15s}
.bubble.show{opacity:1}
.bubble .hd{display:flex;align-items:center;gap:8px}
.bubble .dot{width:12px;height:12px;display:inline-block}
.bubble .who{font:400 9px 'Press Start 2P',monospace}
.bubble .role{font:400 8px 'JetBrains Mono',monospace;color:var(--muted)}
.bubble .txt{font:400 12px/1.5 'JetBrains Mono',monospace;color:#1B1B2F;margin-top:6px;min-height:36px}
.bubble .tail{position:absolute;left:50%;bottom:-14px;width:12px;height:12px;background:var(--parchment);
  border:4px solid #1B1B2F;border-top:none;border-left:none;transform:translateX(-50%) rotate(45deg)}

/* system banner */
.sysbanner{position:absolute;left:50%;top:170px;transform:translateX(-50%);background:#1B1B2F;
  border:4px solid var(--purple);padding:10px 16px;font:400 10px 'Press Start 2P',monospace;color:#C689B0;
  z-index:8;box-shadow:6px 6px 0 rgba(27,27,47,.4);opacity:0;transition:opacity .2s;white-space:nowrap}
.sysbanner.show{opacity:1}

/* footer */
.bottom{display:flex;align-items:center;gap:16px;padding:12px 24px;border-top:4px solid var(--divider)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:7px;font:400 8px 'Press Start 2P',monospace;color:var(--ink);
  padding:6px 8px;box-shadow:3px 3px 0 var(--outline);white-space:nowrap}
.chip .dot{width:8px;height:8px;display:inline-block}
.spacer{flex:1}
.meter-label{font:400 8px 'Press Start 2P',monospace;color:var(--muted)}
.meter{display:flex;gap:2px;width:220px;height:16px;background:#2C2845;padding:3px;box-shadow:inset 2px 2px 0 #1B1B2F}
.seg{flex:1;background:var(--divider)}
.seg.on{background:var(--orange)}
.score{font:400 11px 'Press Start 2P',monospace;color:var(--ink);min-width:44px;text-align:right}

@media (max-width:1220px){.game{width:96vw}}
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="game" id="game">
    <div class="top">
      <div class="left">
        <span class="badge" id="round">DAY · R1</span>
        <div class="titles">
          <h1 id="objective">MATCH · EX-FINANCE CLUSTER</h1>
          <div class="sub" id="subtitle">Deciding who's actually closest to you.</div>
        </div>
      </div>
      <div class="right">
        <div class="timer"><div class="t" id="timer">0:30</div><div class="l">round ends</div></div>
        <button class="replay" id="replayBtn">REPLAY</button>
      </div>
    </div>

    <div class="stage-outer" id="stageOuter">
      <div class="stage" id="stage"></div>
    </div>

    <div class="bottom">
      <div class="chips" id="chips"></div>
      <div class="spacer"></div>
      <div class="meter-label" id="meterLabel">DISAGREE</div>
      <div class="meter" id="meter"></div>
      <div class="score" id="score">0.00</div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   KINDRED · VILLAGE — pixel-art agent-conversation visualizer
   Theme matches the Kindred design system (Press Start 2P + JetBrains Mono,
   dark navy card, gold/orange accents, hard pixel shadows).
   Feed it phase cards (viz/phase_cards*.json) or stream live events.
   LIVE MODE: window.KINDRED_STREAM_URL = SSE endpoint emitting `data: {json}`.
   Event shape: {speaker,text,action:"speak|agree|disagree|resolve",consensus,banner?}
   ========================================================================= */

// ---- agent roster: 8 houses around the plaza, each with a home position ----
const AGENTS = {
  profiler:   {label:"PROFILER",   color:"#4a6ab0", house:"PROFILER",   hx:525, hy:60,  ax:580, ay:169},
  matcher:    {label:"MATCHER",    color:"#c0913c", house:"MATCHER",    hx:760, hy:100, ax:721, ay:235},
  evaluator:  {label:"EVALUATOR",  color:"#b05a5a", house:"EVALUATOR",  hx:905, hy:205, ax:854, ay:273},
  introducer: {label:"INTRODUCER", color:"#5aa860", house:"INTRODUCER", hx:760, hy:440, ax:749, ay:442},
  actian:     {label:"ACTIAN",     color:"#8b6bb0", house:"ACTIAN·DB",  hx:290, hy:440, ax:411, ay:442},
  pioneer:    {label:"PIONEER",    color:"#3c9c9c", house:"PIONEER",    hx:145, hy:335, ax:306, ay:367},
  band:       {label:"BAND",       color:"#c06a9c", house:"BAND",       hx:145, hy:205, ax:306, ay:273},
  gemini:     {label:"GEMINI",     color:"#7c6ad0", house:"GEMINI",     hx:290, hy:100, ax:411, ay:198},
};
const ORDER = Object.keys(AGENTS);

// plaza slots for up to 6 simultaneous active speakers, arranged around the well
const PLAZA_SLOTS = [
  {x:420,y:300},{x:520,y:230},{x:640,y:230},{x:740,y:300},{x:680,y:400},{x:480,y:400}
];

const DEMO_CARD = {
  round:"DAY · R1",
  objective:"MATCH · EX-FINANCE CLUSTER",
  subtitle:"Deciding who's actually closest to you.",
  timer:30,
  statusLine:"CONSENSUS · SHARED TRAJECTORY > SHARED TOPIC",
  script:[
    {speaker:"profiler", text:"Built your profile: ex-finance, agent infra, seeking cofounder.", action:"speak", consensus:0.10},
    {speaker:"actian",   text:"Pulled 30 nearest neighbours from the vector store.", action:"speak", consensus:0.10},
    {speaker:"matcher",  text:"Top picks all share your DOMAIN. Ranking them now.", action:"speak", consensus:0.25},
    {speaker:"evaluator",text:"Careful — same-domain matches only landed 41% of the time.", action:"disagree", consensus:0.25},
    {speaker:"evaluator",text:"Right. Trajectory + what they're seeking predicts landing.", action:"speak", consensus:0.45, banner:"EVALUATOR REWEIGHTS"},
    {speaker:"matcher",  text:"Re-ranking. Dropping two topic matches, adding two trajectory matches.", action:"speak", consensus:0.65},
    {speaker:"profiler", text:"These new ones fit better — same path, same ask.", action:"agree", consensus:0.80},
    {speaker:"matcher",  text:"Agreed. Shared trajectory beats shared topic.", action:"agree", consensus:0.92, banner:"MATCHER STOPPED ARGUING"},
    {speaker:"introducer",text:"Drafting an opener for your top match via BAND.", action:"resolve", consensus:1.0, banner:"CONSENSUS REACHED"},
  ]
};

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------- static scene decor (grass already via CSS; these are town fixtures) ---------- */
function decorHTML(){
  let s = '';
  // pond
  s += `<div class="abs" style="left:950px;top:66px;width:96px;height:54px;border-radius:50%;background:#4C6E96;box-shadow:inset 0 6px 0 #3E5A7D,0 0 0 4px #5F7350"></div>
        <div class="abs" style="left:972px;top:82px;width:40px;height:16px;border-radius:50%;background:#6E93BC"></div>`;
  // well + plaza ring
  s += `<div class="abs" style="left:360px;top:195px;width:440px;height:250px;border-radius:50%;background:#5F5670"></div>
        <div class="abs" style="left:372px;top:203px;width:416px;height:234px;border-radius:50%;background:#8E8399;background-image:repeating-linear-gradient(45deg,#978CA3 0 8px,#857A92 8px 16px),repeating-linear-gradient(-45deg,rgba(0,0,0,.06) 0 8px,transparent 8px 16px);background-size:16px 16px"></div>
        <div class="abs" style="left:552px;top:288px;width:56px;height:30px;background:#8A7B63;box-shadow:inset 0 5px 0 #6B5D48"></div>
        <div class="abs" style="left:556px;top:262px;width:8px;height:28px;background:#5A4632;box-shadow:40px 0 0 #5A4632"></div>
        <div class="abs" style="left:548px;top:250px;width:64px;height:8px;background:#6B5D48"></div>
        <div class="abs" style="left:578px;top:258px;width:4px;height:34px;background:#3B2F22"></div>
        <div class="abs" style="left:572px;top:290px;width:16px;height:11px;background:#C0B49A;box-shadow:inset 0 0 0 3px #8A7B63"></div>`;
  // trees
  [[40,36],[1066,60],[70,490],[1044,470]].forEach(([x,y])=>{
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:48px;height:62px">
      <div class="abs" style="left:6px;top:56px;width:38px;height:9px;border-radius:50%;background:rgba(24,42,18,.35)"></div>
      <div class="abs" style="left:19px;top:44px;width:10px;height:18px;background:#5A4632"></div>
      <div class="abs" style="left:2px;top:20px;width:44px;height:26px;background:#4C6B55;box-shadow:inset -10px -6px 0 #3F5A48"></div>
      <div class="abs" style="left:8px;top:6px;width:32px;height:20px;background:#5B8062;box-shadow:inset -8px -4px 0 #4C6B55"></div>
      <div class="abs" style="left:16px;top:0;width:16px;height:10px;background:#6B9350"></div>
    </div>`;
  });
  // bushes
  [[228,142],[60,390],[498,584],[884,428],[672,576]].forEach(([x,y])=>{
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:28px;height:16px;border-radius:8px 8px 4px 4px;background:#4C6B55;box-shadow:inset -6px -4px 0 #3F5A48"></div>`;
  });
  // lanterns
  [[436,212],[716,212],[436,404],[716,404]].forEach(([x,y])=>{
    s += `<div class="abs" style="left:${x}px;top:${y}px;width:8px;height:34px;background:#2F2D49;box-shadow:inset -2px 0 0 #262338"></div>
          <div class="abs" style="left:${x-6}px;top:${y-16}px;width:20px;height:16px;background:#F2C14E;box-shadow:inset 0 0 0 4px #2F2D49"></div>`;
  });
  // notice board
  s += `<div class="abs" style="left:666px;top:474px;width:6px;height:22px;background:#5A4632;box-shadow:34px 0 0 #5A4632"></div>
        <div class="abs" style="left:658px;top:452px;width:52px;height:26px;background:#7C6A55;box-shadow:inset 0 0 0 4px #5A4632">
          <div class="abs" style="left:7px;top:6px;width:11px;height:14px;background:#F2E9DC"></div>
          <div class="abs" style="right:8px;top:7px;width:11px;height:11px;background:#E8D9BF"></div>
        </div>`;
  // fences
  s += `<div class="abs" style="left:86px;top:296px;width:8px;height:18px;background:#D9CDB4;box-shadow:inset -2px 0 0 #B8AC93,14px 0 0 #D9CDB4,28px 0 0 #D9CDB4,42px 0 0 #D9CDB4"></div>
        <div class="abs" style="left:1008px;top:330px;width:8px;height:18px;background:#D9CDB4;box-shadow:inset -2px 0 0 #B8AC93,14px 0 0 #D9CDB4,28px 0 0 #D9CDB4,42px 0 0 #D9CDB4"></div>`;
  return s;
}

function houseHTML(x,y,color,label){
  const roof = color, roofDark = shade(color,-30), wall = "#9B8264", wallDark = shade("#9B8264",-25);
  return `<div class="house" style="left:${x}px;top:${y}px">
    <div class="abs" style="left:0;top:96px;width:126px;height:16px;border-radius:50%;background:rgba(24,42,18,.32)"></div>
    <div class="abs" style="left:-8px;top:88px;width:126px;height:18px;border-radius:6px;background:#8A7355"></div>
    <div class="abs" style="left:4px;top:58px;width:102px;height:42px;background:${wall}"></div>
    <div class="abs" style="left:44px;top:74px;width:22px;height:26px;background:#5A4632;box-shadow:inset 0 0 0 3px #453524"></div>
    <div class="abs" style="left:12px;top:66px;width:16px;height:16px;background:#F2C14E;box-shadow:inset 0 0 0 3px #453524"></div>
    <div class="abs" style="left:82px;top:66px;width:16px;height:16px;background:#F2C14E;box-shadow:inset 0 0 0 3px #453524"></div>
    <div class="abs" style="left:0;top:30px;width:110px;height:32px;background:${roofDark}"></div>
    <div class="abs" style="left:8px;top:2px;width:94px;height:28px;background:${roof}"></div>
    <div class="abs" style="left:4px;top:27px;width:102px;height:5px;background:${shade(roofDark,-20)}"></div>
    <div class="abs" style="left:76px;top:6px;width:12px;height:16px;background:#6E6E7E;box-shadow:inset -3px 0 0 #5A5A68"></div>
    <div class="plaque">${label}</div>
  </div>`;
}

function villagerHTML(color){
  const dark = shade(color,-30);
  return `<div class="villager">
    <div class="hat" style="background:${dark}"></div>
    <div class="brim" style="background:${shade(color,-45)}"></div>
    <div class="head" style="background:#EAD9C4"></div>
    <div class="body" style="background:${color};box-shadow:inset -5px 0 0 ${dark}"></div>
    <div class="legs" style="background:${dark};box-shadow:8px 0 0 ${dark}"></div>
  </div>`;
}

/* ---------- scene build ---------- */
const stage = document.getElementById('stage');
const stageOuter = document.getElementById('stageOuter');
const nodeEls = {};   // id -> {wrap, bubble, stanceEl}

function fit(){
  const scale = Math.min(stageOuter.clientWidth/1180, stageOuter.clientHeight/620, 1);
  stage.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', fit);

function buildScene(){
  // static scene (decor + houses) never changes after first paint, so it's
  // isolated in its own contained layer — animating villagers/bubbles never
  // triggers a repaint of this expensive, shadow/gradient-heavy content.
  let html = decorHTML();
  ORDER.forEach(id=>{
    const a = AGENTS[id];
    html += houseHTML(a.hx, a.hy, a.color, a.house);
  });
  stage.innerHTML = `<div class="decor">${html}</div>`;

  ORDER.forEach(id=>{
    const a = AGENTS[id];
    const el = document.createElement('div');
    el.className = 'actor';
    el.style.left = (a.ax - 34) + 'px';
    el.style.top = (a.ay - 60) + 'px';
    el.style.zIndex = Math.max(1, Math.round(a.ay - 55));
    el.innerHTML = `
      <div class="name">${a.label}</div>
      <div class="villager-wrap" id="vw-${id}">${villagerHTML(a.color)}</div>
      <div class="shadow"></div>
      <div id="st-${id}"></div>`;
    stage.appendChild(el);
    nodeEls[id] = {el, wrap: el.querySelector('.villager-wrap'), stanceEl: el.querySelector(`#st-${id}`)};
  });

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.id = 'bubble';
  bubble.innerHTML = `<div class="hd"><span class="dot" id="bubDot"></span><span class="who" id="bubWho"></span><span class="role" id="bubRole"></span></div>
    <div class="txt" id="bubTxt"></div><div class="tail"></div>`;
  stage.appendChild(bubble);

  const sys = document.createElement('div');
  sys.className = 'sysbanner';
  sys.id = 'sysbanner';
  stage.appendChild(sys);

  fit();
}

/* ---------- per-card active-speaker placement ---------- */
let activeIds = [];
function placeActive(ids){
  activeIds = ids;
  ids.forEach((id, i)=>{
    const a = AGENTS[id]; if(!a) return;
    const slot = PLAZA_SLOTS[i % PLAZA_SLOTS.length];
    const node = nodeEls[id]; if(!node) return;
    node.el.style.left = (slot.x - 34) + 'px';
    node.el.style.top = (slot.y - 60) + 'px';
    node.el.style.zIndex = Math.max(1, Math.round(slot.y - 55));
  });
  // anyone not active goes home
  ORDER.forEach(id=>{
    if(ids.includes(id)) return;
    const a = AGENTS[id], node = nodeEls[id]; if(!node) return;
    node.el.style.left = (a.ax - 34) + 'px';
    node.el.style.top = (a.ay - 60) + 'px';
    node.el.style.zIndex = Math.max(1, Math.round(a.ay - 55));
  });
}

/* ---------- chips + meter ---------- */
function buildChips(ids){
  const chips = document.getElementById('chips'); chips.innerHTML = '';
  ids.forEach(id=>{
    const a = AGENTS[id]; if(!a) return;
    const c = document.createElement('span');
    c.className = 'chip'; c.style.background = a.color;
    c.innerHTML = `<span class="dot" id="chipdot-${id}" style="background:#8B8AA8"></span>${a.label}`;
    chips.appendChild(c);
  });
}
function setChipStance(id, action){
  const dot = document.getElementById(`chipdot-${id}`); if(!dot) return;
  const color = action==='agree'||action==='resolve' ? 'var(--green)' : action==='disagree' ? 'var(--orange)' : '#8B8AA8';
  dot.style.background = color;
}
function setConsensus(v){
  const segs = document.querySelectorAll('#meter .seg');
  const on = Math.round(v * segs.length);
  segs.forEach((s,i)=>{ s.className = 'seg' + (i<on ? ' on' : ''); });
  document.getElementById('meterLabel').textContent = v>=0.6 ? 'AGREE' : 'DISAGREE';
  document.getElementById('score').textContent = v.toFixed(2);
}
(function initMeter(){
  const meter = document.getElementById('meter');
  for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='seg'; meter.appendChild(s); }
})();

/* ---------- playback engine ---------- */
let timerHandle=null, playHandle=null;
function showBubble(id, text){
  Object.values(nodeEls).forEach(n=> n.wrap.classList.remove('speaking'));
  const node = nodeEls[id]; if(!node) return;
  node.wrap.classList.add('speaking');
  const a = AGENTS[id];
  const bubble = document.getElementById('bubble');
  const anchor = activeIds.includes(id) ? PLAZA_SLOTS[activeIds.indexOf(id) % PLAZA_SLOTS.length] : {x:a.ax,y:a.ay};
  let bx = Math.min(Math.max(anchor.x - 150, 16), 880);
  let by = Math.max(anchor.y - 178, 10);
  bubble.style.left = bx + 'px';
  bubble.style.top = by + 'px';
  document.getElementById('bubDot').style.background = a.color;
  document.getElementById('bubWho').style.color = a.color;
  document.getElementById('bubWho').textContent = a.label;
  document.getElementById('bubRole').textContent = a.house;
  document.getElementById('bubTxt').textContent = text;
  bubble.classList.add('show');
}
function hideBubble(){ document.getElementById('bubble').classList.remove('show'); }
function setStatus(id, action){ setChipStance(id, action); }
function flashBanner(text){
  const b = document.getElementById('sysbanner');
  if(!text){ b.classList.remove('show'); return; }
  b.textContent = text; b.classList.add('show');
  setTimeout(()=> b.classList.remove('show'), 1600);
}
// Bring a newly-speaking agent into the plaza on the fly. Scripted cards
// already set the whole round's cast up front via loadCard(); this is what
// makes LIVE mode (real backend events, no card boundaries) adaptive too —
// whoever is actually communicating walks in, oldest speaker steps out once
// the plaza's 6 slots are full, instead of the cast being fixed at boot.
function ensureActive(id){
  if(!AGENTS[id] || activeIds.includes(id)) return;
  let next = activeIds.concat(id);
  if(next.length > PLAZA_SLOTS.length) next = next.slice(next.length - PLAZA_SLOTS.length);
  placeActive(next);
}
function applyEvent(e){
  if(e.speaker){ ensureActive(e.speaker); showBubble(e.speaker, e.text||''); setStatus(e.speaker, e.action||'speak'); }
  if(typeof e.consensus==='number') setConsensus(e.consensus);
  if(e.banner) flashBanner(e.banner);
}

function loadCard(card){
  document.getElementById('round').textContent = card.round || 'DAY · R1';
  document.getElementById('objective').textContent = card.objective || '';
  document.getElementById('subtitle').textContent = card.subtitle || '';
  const speakers = [...new Set((card.script||[]).map(l=>l.speaker).filter(id=>AGENTS[id]))];
  const ids = speakers.length ? speakers : ORDER.slice(0,3);
  placeActive(ids); buildChips(ids); hideBubble();
  startTimer(card.timer || 30);
}
function startTimer(sec){
  clearInterval(timerHandle); let t = sec;
  const el = document.getElementById('timer');
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  el.textContent = fmt(t);
  timerHandle = setInterval(()=>{ t = Math.max(0,t-1); el.textContent = fmt(t); if(t===0) clearInterval(timerHandle); }, 1000);
}
function playScript(script, stepMs=1900, onDone){
  clearInterval(playHandle); let i = 0;
  setConsensus(0);
  playHandle = setInterval(()=>{
    if(i >= script.length){ clearInterval(playHandle); if(onDone) onDone(); return; }
    applyEvent(script[i]); i++;
  }, stepMs);
}

let CARDS = null;
function playCards(cards, start=0){
  CARDS = cards;
  const card = cards[start % cards.length];
  loadCard(card);
  playScript(card.script, 1900, ()=>{ setTimeout(()=>playCards(cards, start+1), 2200); });
}

/* ---------- live SSE mode (optional) ---------- */
function connectLive(url){
  try{
    const es = new EventSource(url);
    es.onmessage = ev => { try{ applyEvent(JSON.parse(ev.data)); }catch(_){} };
    es.onerror = () => { es.close(); playDemo(); };
    return true;
  }catch(_){ return false; }
}
window.pushAgentEvent = applyEvent;
window.loadPhaseCard = card => { loadCard(card); playScript(card.script); };

/* ---------- boot ---------- */
function playDemo(){ playCards([DEMO_CARD]); }
function boot(){
  buildScene();
  document.getElementById('replayBtn').onclick = ()=>{
    if(window.KINDRED_STREAM_URL){ location.reload(); }
    else if(CARDS){ playCards(CARDS, 0); }
    else playDemo();
  };
  if(window.KINDRED_STREAM_URL){ loadCard(DEMO_CARD); connectLive(window.KINDRED_STREAM_URL); return; }
  fetch('phase_cards.json')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { const cards = Array.isArray(j) ? j : (j.cards||[]); cards.length ? playCards(cards) : playDemo(); })
    .catch(playDemo);
}
boot();
</script>
